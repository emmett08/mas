services:
  mesh:
    image: mas-mesh:local
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: "no"
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777,size=16m
    environment:
      MAS_MODE: mock
      MAS_STATE_DIR: /state
      MAS_TOPOLOGY: /app/examples/host/mesh.json
      MAS_PLANNER_MODEL: ${MAS_PLANNER_MODEL:-gpt-4.1-mini}
      MAS_REVIEWER_MODEL: ${MAS_REVIEWER_MODEL:-gpt-4o-mini}
    volumes:
      - mesh-state:/state

volumes:
  mesh-state:
