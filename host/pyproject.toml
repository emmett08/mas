[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mas-host"
version = "0.1.0"
description = "Reusable Python adapter host for the MAS Rust capability gateway"
requires-python = ">=3.10"
license = "GPL-3.0-only"
dependencies = []

[project.optional-dependencies]
openai = ["openai==3.29.0"]
cursor = ["cursor-sdk==1.0.37"]
temporal = ["temporalio==1.34.0"]
langgraph = ["langgraph==1.2.15"]
bridges = ["jsonschema==4.26.0"]

[project.scripts]
mas-host = "mas_host.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mas_host*"]

[tool.setuptools.package-data]
mas_host = ["cursor_runtime.json", "cursor_bridge_patch.json", "cursor_transport_bootstrap.mjs"]
