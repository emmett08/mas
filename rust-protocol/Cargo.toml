[package]
name = "mas-protocol-codec"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-only"
description = "Rust nom agent protocol, durable mailbox, workflows and SPIN verification"

[dependencies]
nom = "=8.0.0"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde_json = { version = "=1.0.152", features = ["arbitrary_precision"] }
sha2 = "=0.11.0"
subtle = "=2.6.1"
postgres = { version = "=0.19.12", optional = true }
postgres-native-tls = { version = "=0.5.3", optional = true }
native-tls = { version = "=0.2.18", optional = true }

[features]
postgres-repository = ["dep:postgres", "dep:postgres-native-tls", "dep:native-tls"]

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.190"

[[bin]]
name = "mas-protocol-codec"
path = "src/main.rs"

[[bin]]
name = "mas-shared"
path = "src/bin/mas-shared.rs"
required-features = ["postgres-repository"]
