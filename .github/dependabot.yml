version: 2
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
updates:
  - package-ecosystem: cargo
    directory: /rust-protocol
    patterns: ['*']
    multi-ecosystem-group: dependencies
  - package-ecosystem: pip
    directory: /host
    patterns: ['*']
    multi-ecosystem-group: dependencies
    # Regenerate wheel hashes with scripts/release-locks.py before merging.
  - package-ecosystem: docker
    directory: /
    patterns: ['*']
    multi-ecosystem-group: dependencies
  - package-ecosystem: github-actions
    directory: /
    patterns: ['*']
    multi-ecosystem-group: dependencies
