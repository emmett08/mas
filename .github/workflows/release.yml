name: Release candidate artefacts
on:
  push:
    tags: ['v0.*']
    branches: ['release/v0.*']
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  protocol:
    uses: ./.github/workflows/check.yml
  host:
    uses: ./.github/workflows/compose.yml
  security:
    uses: ./.github/workflows/security.yml
  candidate:
    needs: [protocol, host, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      version: ${{ steps.candidate.outputs.version }}
      source: ${{ steps.candidate.outputs.source }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Test candidate source and image archive binding
        run: python -m unittest discover -s scripts/tests -v
      - name: Verify or create the immutable candidate tag
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
        run: python scripts/release-candidate.py
  package:
    needs: candidate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            architecture: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.candidate.outputs.source }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: v0.38.0
          driver-opts: image=moby/buildkit:v0.34.0
      - name: Build OCI archive with build provenance
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          tags: mas-mesh:${{ needs.candidate.outputs.version }}
          provenance: mode=max
          outputs: type=oci,dest=mas-${{ matrix.architecture }}.oci.tar,compression=gzip,force-compression=true
      - name: Import and verify the exact OCI runtime image
        env:
          RELEASE_TAG: ${{ needs.candidate.outputs.version }}
          RELEASE_ARCH: ${{ matrix.architecture }}
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo
          skopeo --version > release-import-tool.txt
          python scripts/release-oci.py "mas-$RELEASE_ARCH.oci.tar" --architecture "$RELEASE_ARCH" --binding release-image-binding.json
          skopeo --override-os linux --override-arch "$RELEASE_ARCH" copy "oci-archive:mas-$RELEASE_ARCH.oci.tar" "docker-daemon:mas-mesh:$RELEASE_TAG"
          docker image inspect mas-mesh:"$RELEASE_TAG" > release-image-identity.json
          python scripts/release-oci.py "mas-$RELEASE_ARCH.oci.tar" --architecture "$RELEASE_ARCH" --binding release-image-binding.json --docker-inspect release-image-identity.json
      - name: Run the native architecture image
        env:
          RELEASE_TAG: ${{ needs.candidate.outputs.version }}
        run: docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges --memory 512m --cpus 1 --pids-limit 64 --tmpfs /state:uid=10001,gid=10001,mode=0700 --tmpfs /tmp mas-mesh:"$RELEASE_TAG"
      - name: Verify the final image runtime and complete host fault suite
        env:
          RELEASE_TAG: ${{ needs.candidate.outputs.version }}
        run: |
          docker run --rm --init --network none --user 10001:10001 --read-only \
            --cap-drop ALL --security-opt no-new-privileges --cpus 1 \
            --memory 512m --memory-swap 512m --pids-limit 64 \
            --tmpfs /tmp:mode=1777,size=256m \
            --mount type=bind,src="$PWD/host/tests",dst=/mounted-tests,readonly \
            --mount type=bind,src="$PWD/examples",dst=/mounted-examples,readonly \
            --mount type=bind,src="$PWD/scripts/release-container-check.py",dst=/release-container-check.py,readonly \
            --entrypoint python mas-mesh:"$RELEASE_TAG" -I /release-container-check.py 2>&1 | tee release-container-tests.log
      - name: Materialise the verified OCI layout for scanning
        id: scanner
        env:
          RELEASE_ARCH: ${{ matrix.architecture }}
        run: |
          python scripts/release-oci.py "mas-$RELEASE_ARCH.oci.tar" --architecture "$RELEASE_ARCH" --binding release-image-binding.json --layout-directory release-oci-layout
          python - <<'PY'
          import json, os
          from pathlib import Path
          binding = json.loads(Path("release-image-binding.json").read_text())
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("input=" + binding["scanner_input"] + "\n")
          PY
      - name: Scan the release runtime manifest
        uses: aquasecurity/trivy-action@c03d123cb480c08c69b054af418ea5e69fe6e57e
        with:
          version: v0.75.0
          input: ${{ steps.scanner.outputs.input }}
          severity: HIGH,CRITICAL
          ignore-unfixed: 'false'
          exit-code: '1'
          scanners: vuln
          format: json
          output: release-audit.json
      - name: Generate release SBOM
        uses: aquasecurity/trivy-action@c03d123cb480c08c69b054af418ea5e69fe6e57e
        with:
          version: v0.75.0
          input: ${{ steps.scanner.outputs.input }}
          format: cyclonedx
          output: release-sbom.cdx.json
      - name: Record source and artefact identity
        env:
          SOURCE_SHA: ${{ needs.candidate.outputs.source }}
          RELEASE_TAG: ${{ needs.candidate.outputs.version }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: python scripts/release-manifest.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mas-${{ needs.candidate.outputs.version }}-${{ matrix.architecture }}
          retention-days: 30
          path: |
            mas-*.oci.tar
            release-audit.json
            release-sbom.cdx.json
            release-manifest.json
            release-image-identity.json
            release-image-binding.json
            release-import-tool.txt
            release-container-tests.log
            SHA256SUMS
