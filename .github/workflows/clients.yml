name: Portable client checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  client:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install exact locked build tools and client
        run: |
          python -m pip install --require-hashes -r host/requirements-build.txt
          python -m pip install --no-deps --no-build-isolation ./host
      - name: Run native HTTP client and command-line conformance
        run: python -m unittest discover -s host/tests -p test_portable_client.py -v
