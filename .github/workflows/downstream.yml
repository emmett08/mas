name: Downstream compatibility
on:
  workflow_call:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  native-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_HOME: ${{ github.workspace }}/.candidate-cargo
    defaults:
      run:
        working-directory: .consumers/mas-host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: emmett08/mas-host
          ref: 71e40fe57521aa1048d001dff16c40379a3a3046
          path: .consumers/mas-host
          persist-credentials: false
      - uses: ./.github/actions/toolchains
        with:
          go: 'true'
          node: 'true'
          rust-components: rustfmt,clippy
      - uses: ./.github/actions/downstream-protocol
        with:
          directory: .consumers/mas-host
      - name: Native host, SDKs and effect recovery against candidate protocol
        run: |
          make test
          make acceptance
          make provider-test
      - name: Check bounded revision and disclosure
        run: |
          sudo apt-get update
          sudo apt-get install -y spin
          python3 formal/verify.py
  example-suite:
    name: Examples (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Each suite gets its own checkout because the consumer's Makefile shares
    # generated worker directories and explicitly forbids parallel make targets.
    strategy:
      fail-fast: false
      matrix:
        suite: [applications, interoperability, incident]
    env:
      CARGO_HOME: ${{ github.workspace }}/.candidate-cargo
    defaults:
      run:
        working-directory: .consumers/examples
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: emmett08/mas-host-examples
          ref: 6899cceb6314e0191070d6f5a0ae8d4100b4c6a0
          path: .consumers/examples
          persist-credentials: false
      - uses: ./.github/actions/toolchains
        with:
          go: ${{ matrix.suite != 'incident' }}
          node: ${{ matrix.suite == 'interoperability' }}
          rust-components: ${{ matrix.suite == 'applications' && 'rustfmt,clippy' || '' }}
      - name: Read the example repository's unchanged host pin
        id: host
        run: |
          revision="$(cat host-revision.txt)"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: emmett08/mas-host
          ref: ${{ steps.host.outputs.revision }}
          path: .consumers/examples/.tools/mas-host
          persist-credentials: false
      - uses: ./.github/actions/downstream-protocol
        with:
          directory: .consumers/examples/.tools/mas-host
      - name: Build host with only the protocol dependency overridden
        run: cargo build --locked --manifest-path .tools/mas-host/Cargo.toml --target-dir .tools/mas-host/target -p mas-host
      - name: Application acceptance and documented commands
        if: ${{ matrix.suite == 'applications' }}
        run: |
          make verify
          make go rust cpp python python-client command star tree mesh composed
          make a2a
      - name: Official A2A SDK interoperability
        if: ${{ matrix.suite == 'interoperability' }}
        run: |
          python3 -m venv .tools/a2a-sdk
          .tools/a2a-sdk/bin/python -m pip install -r examples/a2a-review/requirements-sdk.txt
          .tools/a2a-sdk/bin/python examples/a2a-review/sdk_check.py --report .state/a2a-review/official-sdk.json
      - name: Mixed-agent protocol and assessment conformance
        if: ${{ matrix.suite == 'interoperability' }}
        working-directory: .consumers/examples/examples/k3s-live
        env:
          MAS_HOST_BIN: ${{ github.workspace }}/.consumers/examples/.tools/mas-host/target/debug/mas-host
          MAS_SDK_ROOT: ${{ github.workspace }}/.consumers/examples/.tools/mas-host
        run: |
          npm ci --ignore-scripts
          npm run test:host
      - name: Check frozen incident experiment and run the credential-free rehearsal
        if: ${{ matrix.suite == 'incident' }}
        run: |
          python3 -m unittest discover -s experiments/incident-revision -p 'test_*.py'
          python3 experiments/incident-revision/run.py freeze --out .state/incident-pilot --host .tools/mas-host/target/debug/mas-host --sdk .tools/mas-host --mode fixture
          python3 experiments/incident-revision/run.py run --out .state/incident-pilot
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          result = json.loads(Path('.state/incident-pilot/results.json').read_text())
          assert result['mode'] == 'fixture' and result['status'] == 'fixture-rehearsal', 'Expected fixture rehearsal'
          assert result['promotion'] is False, 'Fixture cannot establish empirical promotion'
          assert result['failure_override'] is False and result['missing_or_failed_runs'] == 0, 'Fixture has failed or missing arms'
          expected_calls = {'one_pass': 36, 'revision': 144, 'resample': 144}
          assert set(result['by_arm']) == set(expected_calls), 'Unexpected experiment arms'
          for arm, calls in expected_calls.items():
              observed = result['by_arm'][arm]
              assert observed['runs'] == 36, f'{arm}: incomplete repeated trials'
              assert observed['missing_output'] == 0, f'{arm}: missing output'
              assert observed['provider_calls'] == calls, f'{arm}: expected provider effects were not exercised'
          assert result['incident_count'] == 12 and result['independent_families'] == 6, 'Incomplete incident coverage'
          print('Verified 108 complete fixture arms and 324 provider effects.')
          PYTHON
  examples:
    if: ${{ always() }}
    needs: example-suite
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every examples suite
        env:
          RESULT: ${{ needs.example-suite.result }}
        run: test "$RESULT" = success
  demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_HOME: ${{ github.workspace }}/.candidate-cargo
    defaults:
      run:
        working-directory: .consumers/demo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: emmett08/mas-demo
          ref: 4e0d2f6ff8a9cd20c75f9ae18e0d0bbe4c89b96d
          path: .consumers/demo
          persist-credentials: false
      - uses: ./.github/actions/toolchains
        with:
          go: 'true'
          node: 'true'
      - name: Build candidate protocol CLI
        run: |
          cargo build --release --locked --manifest-path "$GITHUB_WORKSPACE/rust-protocol/Cargo.toml" --bin mas
          echo "MAS_BIN=$GITHUB_WORKSPACE/rust-protocol/target/release/mas" >> "$GITHUB_ENV"
      - name: Install pinned Copilot CLI for credential-free compatibility tests
        run: |
          npm install --prefix "$RUNNER_TEMP/copilot-cli" --no-audit --no-fund @github/copilot@1.0.98
          echo "COPILOT_TEST_BIN=$RUNNER_TEMP/copilot-cli/node_modules/.bin/copilot" >> "$GITHUB_ENV"
      - name: Validate Go and real MAS integration
        run: |
          set -euo pipefail
          go -C "$GITHUB_WORKSPACE/.consumers/demo" test -race -count=1 ./...
          go -C "$GITHUB_WORKSPACE/.consumers/demo" vet ./...
          go -C "$GITHUB_WORKSPACE/.consumers/demo" build -o "$RUNNER_TEMP/mas-rollout-demo" .
      - name: Run all offline scenarios and check decisions
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/mas-reports"
          for scenario in healthy capacity unsafe-image missing-telemetry; do
            case "$scenario" in
              healthy) expected=proceed ;;
              missing-telemetry) expected=inconclusive ;;
              *) expected=hold ;;
            esac
            "$RUNNER_TEMP/mas-rollout-demo" -mas-bin "$MAS_BIN" \
              -agents-config "$GITHUB_WORKSPACE/.consumers/demo/config/offline.json" \
              -scenario "$scenario" -state-dir "$RUNNER_TEMP/mas-reports/$scenario" \
              > "$RUNNER_TEMP/mas-reports/$scenario.json"
            jq -e --arg expected "$expected" \
              '.decision == $expected and .mas_usage.messages == 28 and .mas_usage.calls == 0' \
              "$RUNNER_TEMP/mas-reports/$scenario.json"
          done
