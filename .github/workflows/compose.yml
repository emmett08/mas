name: Host and Compose checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  reference:
    uses: emmett08/mas-reference-host/.github/workflows/compose.yml@cffd4ba2a5634b7f3e737ac674c8fd42c59ea48b
    with:
      reference_host_ref: cffd4ba2a5634b7f3e737ac674c8fd42c59ea48b
      protocol_ref: ${{ github.sha }}
  # Preserve required status contexts and reject skipped prerequisites.
  host-and-compose:
    needs: reference
    if: ${{ always() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - name: Require every migrated host and container qualification
        env:
          RESULT: ${{ needs.reference.result }}
        run: test "$RESULT" = success
