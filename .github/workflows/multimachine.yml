name: Independent machine worker qualification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: mas-multimachine-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  reference:
    uses: emmett08/mas-reference-host/.github/workflows/multimachine.yml@11351c72675732214ee29c2b7c18755bcd5071f6
    with:
      reference_host_ref: 11351c72675732214ee29c2b7c18755bcd5071f6
      protocol_ref: ${{ github.sha }}
