name: PostgreSQL protocol repository
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: mas-postgres-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  reference:
    uses: emmett08/mas-reference-host/.github/workflows/postgres.yml@11351c72675732214ee29c2b7c18755bcd5071f6
    with:
      reference_host_ref: 11351c72675732214ee29c2b7c18755bcd5071f6
      protocol_ref: ${{ github.sha }}

  native-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_PASSWORD: fixture-password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      MAS_TEST_POSTGRES_DSN: host=localhost user=postgres password=fixture-password dbname=postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Exercise actual PostgreSQL authority and native admission
        run: cargo test --locked --manifest-path rust-protocol/Cargo.toml --features postgres-repository --test postgres_repository -- --ignored --test-threads=2
