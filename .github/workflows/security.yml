name: Dependency and image security
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '17 6 * * 1'
permissions:
  contents: read
jobs:
  reference:
    uses: emmett08/mas-reference-host/.github/workflows/security.yml@cffd4ba2a5634b7f3e737ac674c8fd42c59ea48b
    with:
      reference_host_ref: cffd4ba2a5634b7f3e737ac674c8fd42c59ea48b
      protocol_ref: ${{ github.sha }}
  dependency-audit:
    needs: reference
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require migrated dependency and image audits
        env:
          RESULT: ${{ needs.reference.result }}
        run: test "$RESULT" = success
  image-audit:
    needs: reference
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require migrated dependency and image audits
        env:
          RESULT: ${{ needs.reference.result }}
        run: test "$RESULT" = success
