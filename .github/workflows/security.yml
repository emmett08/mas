name: Dependency and image security
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '17 6 * * 1'
permissions:
  contents: read
concurrency:
  group: mas-security-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  reference:
    uses: emmett08/mas-reference-host/.github/workflows/security.yml@11351c72675732214ee29c2b7c18755bcd5071f6
    with:
      reference_host_ref: 11351c72675732214ee29c2b7c18755bcd5071f6
      protocol_ref: ${{ github.sha }}
  dependency-audit:
    needs: reference
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require migrated dependency and image audits
        env:
          RESULT: ${{ needs.reference.result }}
        run: test "$RESULT" = success
  image-audit:
    needs: reference
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require migrated dependency and image audits
        env:
          RESULT: ${{ needs.reference.result }}
        run: test "$RESULT" = success
