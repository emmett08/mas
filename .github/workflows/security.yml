name: Dependency and image security
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '17 6 * * 1'
permissions:
  contents: read
jobs:
  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install locked Python auditor
        run: python -m pip install --require-hashes -r host/requirements-security.txt
      - name: Audit runtime, build and scanner dependencies
        run: python scripts/release-audit.py
      - name: Install pinned Cargo auditor
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          cargo +1.88.0 install cargo-audit --version 0.22.2 --locked
      - name: Audit Cargo lock
        run: cargo audit --file rust-protocol/Cargo.lock --json > cargo-audit.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dependency-audits
          path: '*audit.json'
  image-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build pinned image
        run: docker compose build
      - name: Scan image including unfixed high and critical advisories
        uses: aquasecurity/trivy-action@c03d123cb480c08c69b054af418ea5e69fe6e57e
        with:
          version: v0.75.0
          image-ref: mas-mesh:local
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: 'false'
          exit-code: '1'
          format: json
          output: image-audit.json
      - name: Produce complete image SBOM
        if: always()
        uses: aquasecurity/trivy-action@c03d123cb480c08c69b054af418ea5e69fe6e57e
        with:
          version: v0.75.0
          image-ref: mas-mesh:local
          format: cyclonedx
          output: image-sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: image-audit
          path: |
            image-audit.json
            image-sbom.cdx.json
