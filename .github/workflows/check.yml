name: Protocol checks
on: [push, pull_request, workflow_dispatch, workflow_call]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust and SPIN
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          sudo apt-get update
          sudo apt-get install -y spin
      - name: Native tests and build
        run: |
          cargo test --locked --manifest-path rust-protocol/Cargo.toml
          cargo build --release --locked --manifest-path rust-protocol/Cargo.toml
      - name: SPIN simulations and verification
        run: ./rust-protocol/target/release/verify
      - name: Executable examples
        run: make examples
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: protocol-evidence
          path: |
            formal/evidence
            evidence/examples
