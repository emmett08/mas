name: Protocol checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
concurrency:
  group: protocol-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust and SPIN
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          sudo apt-get update
          sudo apt-get install -y spin
      - name: Native tests and build
        run: |
          cargo test --locked --manifest-path rust-protocol/Cargo.toml
          cargo build --release --locked --manifest-path rust-protocol/Cargo.toml
      - name: SPIN simulations and verification
        run: ./rust-protocol/target/release/verify
      - name: Executable examples
        run: make examples
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: protocol-evidence
          path: |
            formal/evidence
            evidence/examples
  downstream:
    uses: ./.github/workflows/downstream.yml
  check:
    if: ${{ always() }}
    needs: [protocol, downstream, reference-host]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require protocol and downstream compatibility
        env:
          PROTOCOL_RESULT: ${{ needs.protocol.result }}
          DOWNSTREAM_RESULT: ${{ needs.downstream.result }}
          REFERENCE_RESULT: ${{ needs.reference-host.result }}
        run: |
          test "$PROTOCOL_RESULT" = success
          test "$DOWNSTREAM_RESULT" = success
          test "$REFERENCE_RESULT" = success
  reference-host:
    uses: emmett08/mas-reference-host/.github/workflows/check.yml@cffd4ba2a5634b7f3e737ac674c8fd42c59ea48b
    with:
      reference_host_ref: cffd4ba2a5634b7f3e737ac674c8fd42c59ea48b
      protocol_ref: ${{ github.sha }}
