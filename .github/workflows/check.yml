name: Protocol checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
concurrency:
  group: protocol-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust and SPIN
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          sudo apt-get update
          sudo apt-get install -y spin
      - name: Native tests and build
        run: |
          cargo test --locked --manifest-path rust-protocol/Cargo.toml
          cargo build --release --locked --manifest-path rust-protocol/Cargo.toml
      - name: SPIN simulations and verification
        run: ./rust-protocol/target/release/verify
      - name: Executable examples
        run: make examples
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: protocol-evidence
          path: |
            formal/evidence
            evidence/examples
